<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Styles */
        nav {
            background: #1e293b;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo-link img {
            height: 40px;
            display: block;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            text-decoration: none;
            color: #94a3b8;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        /* Main Content */
        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2.5rem;
            padding: 2rem;
            flex-wrap: wrap;
        }

        /* Link Wrapper styling to prevent default blue/underline */
        .box-link {
            text-decoration: none;
            color: inherit;
        }

        .box {
            width: 280px;
            height: 220px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 18px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .box span {
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #94a3b8;
            transition: color 0.3s ease;
        }

        /* Icon Styling */
        .box svg {
            width: 64px;
            height: 64px;
            fill: none;
            stroke: #64748b;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.4s ease;
        }

        /* Hover Effects */
        .box:hover {
            transform: translateY(-12px);
            background: rgba(56, 189, 248, 0.08);
            border-color: #38bdf8;
            box-shadow: 0 20px 40px -15px rgba(56, 189, 248, 0.25);
        }

        .box:hover svg {
            stroke: #38bdf8;
            transform: scale(1.1);
            filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.5));
        }

        .box:hover span {
            color: white;
        }

        /* Responsive */
        @media (max-width: 650px) {
            .container { gap: 1.5rem; }
            .box { width: 300px; height: 180px; }
            .nav-links { gap: 1rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo-link">
            <img src="logo123.png" alt="Logo">
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        
        <a href="coding-guide.html" class="box-link">
            <div class="box">
                <svg viewBox="0 0 24 24">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                <span>New to coding</span>
            </div>
        </a>

        <a href="web.html" class="box-link">
            <div class="box">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                <span>Templates</span>
            </div>
        </a>

    </div>

</body>
</html>
