<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Dashboard | System Access</title>
<style>
  :root {
    --neon-cyan: #00f2ff;
    --neon-purple: #7000ff;
    --bg-dark: #0d0d0d;
    --nav-bg: #1a1a1a;
  }

  body {
    background-color: var(--bg-dark);
    margin: 0;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background Glow Orbs */
  .bg-glow {
    position: fixed;
    width: 400px;
    height: 400px;
    background: var(--neon-purple);
    filter: blur(180px);
    opacity: 0.15;
    z-index: -1;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  /* Logo Styling */
  .logo {
    position: absolute;
    top: 15px;
    left: 30px;
    height: 45px;
    width: auto;
    z-index: 100;
  }

  /* Neon Navigation */
  nav {
    width: 100%;
    background-color: var(--nav-bg);
    padding: 25px 0;
    display: flex;
    justify-content: center;
    gap: 40px;
    border-bottom: 2px solid var(--neon-cyan);
    box-shadow: 0 5px 20px rgba(0, 242, 255, 0.2);
    position: relative;
  }

  nav a {
    text-decoration: none;
    color: var(--neon-cyan);
    font-weight: 600;
    letter-spacing: 2px;
    font-size: 14px;
    transition: 0.3s ease;
    text-transform: uppercase;
  }

  nav a:hover {
    text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
    color: #fff;
  }

  /* Main Layout */
  .container {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
  }

  h1 {
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    margin-bottom: 60px;
    text-transform: uppercase;
    letter-spacing: 8px;
    color: #fff;
    text-shadow: 0 0 15px var(--neon-purple);
    text-align: center;
  }

  .dashboard {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 40px;
  }

  /* Dashboard Box Fixes */
  .box-link {
    text-decoration: none;
    display: block;
  }

  .box {
    width: 200px;
    height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--neon-purple);
    border-radius: 12px;
    font-size: 20px; /* Reduced to fix overflow */
    font-weight: bold;
    color: var(--neon-purple);
    background-color: rgba(112, 0, 255, 0.05);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: inset 0 0 15px rgba(112, 0, 255, 0.1);
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .box i {
    font-size: 40px; /* Space for an icon if you add one later */
    margin-bottom: 15px;
  }

  .box:hover {
    background-color: var(--neon-purple);
    color: #fff;
    transform: scale(1.08) translateY(-10px);
    box-shadow: 0 0 30px var(--neon-purple), 0 0 60px rgba(112, 0, 255, 0.4);
    border-color: #fff;
  }

  /* Footer Section */
  footer {
    padding: 20px;
    text-align: center;
    font-size: 12px;
    color: #555;
    letter-spacing: 1px;
    border-top: 1px solid #222;
  }

  /* Responsive adjustment for small screens */
  @media (max-width: 600px) {
    .dashboard {
      gap: 20px;
    }
    .box {
      width: 150px;
      height: 150px;
      font-size: 16px;
    }
    nav {
      gap: 20px;
    }
  }
</style>
</head>
<body>

<div class="bg-glow"></div>

<!-- Replace with your actual logo path -->
<img src="logo123.png" alt="LOGO" class="logo" onerror="this.style.display='none'">

<nav>
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>
</nav>

<div class="container">
  <h1>What you want?</h1>
  
  <div class="dashboard">
    <a href="tems.html" class="box-link">
      <div class="box">
        <span>Dashboards</span>
      </div>
    </a>

    <a href="2.html" class="box-link">
      <div class="box">
        <span> Code</span>
      </div>
    </a>

    
  </div>
</div>

<footer>
  &copy; 2026 NEON TERMINAL. ALL RIGHTS RESERVED.
</footer>

</body>
</html>
