<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Unbreakable Name Streamliner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #09090e 0%, #130a24 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 1000px;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(45deg, #ff007f, #7928ca, #00dfd8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        @media (max-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }
        .box {
            display: flex;
            flex-direction: column;
        }
        .label {
            font-weight: 700;
            margin-bottom: 12px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .label.input-lbl { color: #00dfd8; }
        .label.output-lbl { color: #ff007f; }
        
        textarea {
            width: 100%;
            height: 420px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            line-height: 1.6;
            resize: none;
            transition: all 0.3s ease;
        }
        textarea:focus {
            outline: none;
        }
        #inputText:focus { border-color: #00dfd8; box-shadow: 0 0 20px rgba(0, 223, 216, 0.3); }
        #outputText:focus { border-color: #ff007f; box-shadow: 0 0 20px rgba(255, 0, 127, 0.3); }

        .action-area {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }
        @media (max-width: 480px) {
            .action-area {
                flex-direction: column;
            }
        }
        button {
            padding: 16px 45px;
            font-size: 15px;
            font-weight: 800;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .btn-clean {
            background: linear-gradient(45deg, #00dfd8, #007bff);
            color: white;
        }
        .btn-clean:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 223, 216, 0.5);
        }
        .btn-copy {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: white;
        }
        .btn-copy:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 0, 127, 0.5);
        }
        .btn-copy.copied {
            background: linear-gradient(45deg, #00ff66, #009933);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ Unbreakable Name Streamliner ⚡</h2>
    
    <div class="grid-layout">
        <div class="box">
            <span class="label input-lbl">📥 Paste Any Text (Headings/Descriptions):</span>
            <textarea id="inputText" placeholder="Paste your raw layouts here..."></textarea>
        </div>
        
        <div class="box">
            <span class="label output-lbl">📤 Pure Clean Styles Only (1 Per Row):</span>
            <textarea id="outputText" placeholder="Clean names will render here..." readonly></textarea>
        </div>
        
        <div class="action-area">
            <button class="btn-clean" onclick="forceCleanText()">⚡ Purify Text</button>
            <button class="btn-copy" id="copyBtn" onclick="copyToClipboard()">📋 Copy Clean Text</button>
        </div>
    </div>
</div>

<script>
function forceCleanText() {
    const input = document.getElementById('inputText').value;
    const lines = input.split('\n');
    
    const cleanedLines = lines.filter(line => {
        const trimmed = line.trim();
        
        // 1. Instantly skip empty lines
        if (trimmed === '') return false;
        
        // 2. Drop obvious manual keyword headings
        if (trimmed.toLowerCase().includes('category') || trimmed.includes(' - ')) return false;
        
        // 3. Simple Sentence Filter:
        // If a line contains more than 3 standard plain spaces between words, 
        // it's a structural description sentence (e.g. "Consistent block letter styles mixed with...")
        // All of your fancy names have symbols, accents, or compressed spaces.
        const normalSpaceCount = (trimmed.match(/ /g) || []).length;
        const onlyNormalLetters = /^[a-zA-Z0-9\s.,:()&'!\-[\]]+$/.test(trimmed);
        
        if (onlyNormalLetters && normalSpaceCount > 2) {
            return false; 
        }

        // 4. Numerical Heading Filter:
        // Captures titles like "51 to 100: Sign Borders..."
        if (/^\d+\s+to\s+\d+:/i.test(trimmed)) {
            return false;
        }
        
        return true; 
    });
    
    document.getElementById('outputText').value = cleanedLines.join('\n');
    
    // Reset Copy Button
    const copyBtn = document.getElementById('copyBtn');
    copyBtn.className = "btn-copy";
    copyBtn.innerHTML = "📋 Copy Clean Text";
}

function copyToClipboard() {
    const outputText = document.getElementById('outputText');
    const copyBtn = document.getElementById('copyBtn');
    
    if (!outputText.value) {
        alert("Paste your raw lists and press Purify first!");
        return;
    }
    
    outputText.select();
    outputText.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(outputText.value);
    
    copyBtn.className = "btn-copy copied";
    copyBtn.innerHTML = "✅ Copied to Clipboard!";
}
</script>

</body>
</html>s
