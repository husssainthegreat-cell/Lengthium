<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Text Cleaner & Heading Remover</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #251c3d 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 100%;
            max-width: 850px;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 2rem;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #ff007f, #7928ca, #00dfd8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }
        .box {
            display: flex;
            flex-direction: column;
        }
        .label {
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        .label.input-lbl { color: #00dfd8; }
        .label.output-lbl { color: #ff007f; }
        
        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            line-height: 1.5;
            resize: none;
            transition: all 0.3s ease;
        }
        textarea:focus {
            outline: none;
        }
        #inputText:focus { border-color: #00dfd8; box-shadow: 0 0 10px rgba(0, 223, 216, 0.3); }
        #outputText:focus { border-color: #ff007f; box-shadow: 0 0 10px rgba(255, 0, 127, 0.3); }

        .action-area {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }
        @media (max-width: 480px) {
            .action-area {
                flex-direction: column;
            }
        }
        button {
            padding: 14px 35px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn-clean {
            background: linear-gradient(45deg, #00dfd8, #007bff);
            color: #fff;
        }
        .btn-clean:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 223, 216, 0.4);
        }
        .btn-copy {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: #fff;
        }
        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.4);
        }
        .btn-copy.copied {
            background: linear-gradient(45deg, #00ff87, #60efff);
            color: #111;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>✨ Text Styling Cleaner ✨</h2>
    
    <div class="grid-layout">
        <div class="box">
            <span class="label input-lbl">📥 Paste Raw Text Here:</span>
            <textarea id="inputText" placeholder="Paste your text with 'Category' headings here..."></textarea>
        </div>
        
        <div class="box">
            <span class="label output-lbl">📤 Cleaned Output (One per row):</span>
            <textarea id="outputText" placeholder="Cleaned text will appear here..." readonly></textarea>
        </div>
        
        <div class="action-area">
            <button class="btn-clean" onclick="removeHeadings()">⚡ Remove Headings</button>
            <button class="btn-copy" id="copyBtn" onclick="copyToClipboard()">📋 Copy Clean Text</button>
        </div>
    </div>
</div>

<script>
function removeHeadings() {
    const input = document.getElementById('inputText').value;
    const lines = input.split('\n');
    
    const cleanedLines = lines.filter(line => {
        const trimmedLine = line.trim();
        
        // Exclude lines starting with "Category"
        if (trimmedLine.toLowerCase().startsWith('category')) {
            return false;
        }
        // Exclude empty lines
        if (trimmedLine === '') {
            return false;
        }
        return true;
    });
    
    document.getElementById('outputText').value = cleanedLines.join('\n');
    
    // Reset copy button visual state if new text is processed
    const copyBtn = document.getElementById('copyBtn');
    copyBtn.className = "btn-copy";
    copyBtn.innerHTML = "📋 Copy Clean Text";
}

function copyToClipboard() {
    const outputText = document.getElementById('outputText');
    const copyBtn = document.getElementById('copyBtn');
    
    if (!outputText.value) {
        alert("Nothing to copy yet! Please clean some text first.");
        return;
    }
    
    // Select and copy text
    outputText.select();
    outputText.setSelectionRange(0, 99999); // For mobile devices
    navigator.clipboard.writeText(outputText.value);
    
    // Change button appearance temporarily to give feedback
    copyBtn.className = "btn-copy copied";
    copyBtn.innerHTML = "✅ Copied Successfully!";
}
</script>

</body>
</html>
