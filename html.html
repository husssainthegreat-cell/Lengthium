<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Text Heading Remover</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #121214 0%, #1a1a24 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 900px;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #00ffcc, #0099ff, #7928ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }
        .box {
            display: flex;
            flex-direction: column;
        }
        .label {
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .label.input-lbl { color: #00ffcc; }
        .label.output-lbl { color: #0099ff; }
        
        textarea {
            width: 100%;
            height: 350px;
            padding: 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            line-height: 1.6;
            resize: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        textarea:focus {
            outline: none;
        }
        #inputText:focus { border-color: #00ffcc; box-shadow: 0 0 15px rgba(0, 255, 204, 0.25); }
        #outputText:focus { border-color: #0099ff; box-shadow: 0 0 15px rgba(0, 153, 255, 0.25); }

        .action-area {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }
        @media (max-width: 480px) {
            .action-area {
                flex-direction: column;
            }
        }
        button {
            padding: 15px 40px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-clean {
            background: linear-gradient(45deg, #00ffcc, #00aaff);
            color: #0b0b10;
        }
        .btn-clean:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 255, 204, 0.4);
        }
        .btn-copy {
            background: linear-gradient(45deg, #0055ff, #7928ca);
            color: #fff;
        }
        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 85, 255, 0.4);
        }
        .btn-copy.copied {
            background: linear-gradient(45deg, #10b981, #059669);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>✨ Universal Name Cleaner ✨</h2>
    
    <div class="grid-layout">
        <div class="box">
            <span class="label input-lbl">📥 Paste Raw Text Here:</span>
            <textarea id="inputText" placeholder="Paste your text with any kind of headers here..."></textarea>
        </div>
        
        <div class="box">
            <span class="label output-lbl">📤 Cleaned Output (One per row):</span>
            <textarea id="outputText" placeholder="Cleaned styles will show here..." readonly></textarea>
        </div>
        
        <div class="action-area">
            <button class="btn-clean" onclick="removeHeadings()">⚡ Remove Headings</button>
            <button class="btn-copy" id="copyBtn" onclick="copyToClipboard()">📋 Copy Clean Text</button>
        </div>
    </div>
</div>

<script>
function removeHeadings() {
    const input = document.getElementById('inputText').value;
    const lines = input.split('\n');
    
    const cleanedLines = lines.filter(line => {
        const trimmedLine = line.trim();
        
        // 1. Skip completely empty lines
        if (trimmedLine === '') {
            return false;
        }
        
        // 2. Multi-rule Heading Check:
        // Skips lines containing "Category" OR containing " - " (used in language headers)
        if (trimmedLine.toLowerCase().includes('category') || trimmedLine.includes(' - ')) {
            return false;
        }
        
        return true;
    });
    
    document.getElementById('outputText').value = cleanedLines.join('\n');
    
    // Reset copy button styling when a fresh list is generated
    const copyBtn = document.getElementById('copyBtn');
    copyBtn.className = "btn-copy";
    copyBtn.innerHTML = "📋 Copy Clean Text";
}

function copyToClipboard() {
    const outputText = document.getElementById('outputText');
    const copyBtn = document.getElementById('copyBtn');
    
    if (!outputText.value) {
        alert("Please paste your text and click 'Remove Headings' first!");
        return;
    }
    
    outputText.select();
    outputText.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(outputText.value);
    
    copyBtn.className = "btn-copy copied";
    copyBtn.innerHTML = "✅ Copied to Clipboard!";
}
</script>

</body>
</html>
