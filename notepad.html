<html lang="en">
<head>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        /* Top Utility Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 10px 15px;
            border-radius: 8px 8px 0 0;
            border: 1px solid #ccc;
            border-bottom: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .file-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        .btn-danger {
            background-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #bd2130;
        }
        .status {
            font-size: 13px;
            color: #28a745;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .status.visible {
            opacity: 1;
        }

        /* Tabs Bar */
        .tabs-bar {
            display: flex;
            align-items: center;
            background: #e9ecef;
            border-left: 1px solid #ccc;
            border-right: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
            padding: 5px 10px 0 10px;
            overflow-x: auto;
        }
        .tab {
            display: flex;
            align-items: center;
            background: #dfe2e6;
            padding: 6px 12px;
            margin-right: 5px;
            border-radius: 6px 6px 0 0;
            border: 1px solid #ccc;
            border-bottom: none;
            cursor: pointer;
            font-size: 14px;
            max-width: 150px;
            user-select: none;
        }
        .tab.active {
            background: #ffffff;
            font-weight: bold;
            border-bottom: 1px solid #ffffff;
            margin-bottom: -1px;
            z-index: 1;
        }
        .tab span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tab .close-tab {
            margin-left: 8px;
            font-weight: bold;
            color: #999;
            cursor: pointer;
        }
        .tab .close-tab:hover {
            color: #dc3545;
        }
        .add-tab-btn {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            width: 24px;
            height: 24px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
            margin-left: 5px;
        }
        .add-tab-btn:hover {
            background: #0056b3;
        }

        /* Text Area */
        textarea {
            width: 100%;
            flex-grow: 1;
            padding: 20px;
            font-size: 16px;
            line-height: 1.5;
            border: 1px solid #ccc;
            border-top: none;
            border-radius: 0 0 8px 8px;
            resize: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            outline: none;
            font-family: inherit;
            background: #fff;
        }

        /* Custom Modal Popup System */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 100;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal {
            background: white;
            padding: 20px 25px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            transform: translateY(-20px);
            transition: transform 0.2s ease;
        }
        .modal-overlay.active .modal {
            transform: translateY(0);
        }
        .modal h3 {
            margin-top: 0;
            margin-bottom: 12px;
            color: #333;
        }
        .modal input[type="text"] {
            width: 100%;
            padding: 8px 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 15px;
            outline: none;
        }
        .modal input[type="text"]:focus {
            border-color: #007bff;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div class="file-actions">
                <button class="btn" id="downloadBtn">📥 Download Page</button>
                <button class="btn btn-secondary" id="renameBtn">✏️ Rename Page</button>
                <span class="status" id="status">Saved</span>
            </div>
        </div>

        <div class="tabs-bar">
            <div id="tabsContainer" style="display: flex;"></div>
            <button class="add-tab-btn" id="addTabBtn" title="Add new page">+</button>
        </div>

        <textarea id="notepad" placeholder="Start typing here..."></textarea>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle">Popup Title</h3>
            <div id="modalInputContainer">
                <input type="text" id="modalInput" placeholder="Enter text here...">
            </div>
            <p id="modalMessage" style="margin-bottom: 15px; color: #555; display: none;"></p>
            <div class="modal-buttons">
                <button class="btn btn-secondary" id="modalCancelBtn">Cancel</button>
                <button class="btn" id="modalConfirmBtn">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        const notepad = document.getElementById('notepad');
        const tabsContainer = document.getElementById('tabsContainer');
        const addTabBtn = document.getElementById('addTabBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const renameBtn = document.getElementById('renameBtn');
        const statusText = document.getElementById('status');

        // Modal Elements
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalInput = document.getElementById('modalInput');
        const modalInputContainer = document.getElementById('modalInputContainer');
        const modalMessage = document.getElementById('modalMessage');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalConfirmBtn = document.getElementById('modalConfirmBtn');

        // App State
        let state = {
            activeTabId: '1',
            pages: {
                '1': { title: 'Notes 1', content: '' }
            }
        };

        let saveTimeout = null;
        let currentModalAction = null; 
        let targetDeleteId = null;     

        // Load data on startup
        function loadData() {
            const savedState = localStorage.getItem('notepad_multitab_state');
            if (savedState) {
                state = JSON.parse(savedState);
            }
            renderTabs();
            loadActivePageContent();
        }

        // Save data
        function saveData() {
            localStorage.setItem('notepad_multitab_state', JSON.stringify(state));
            statusText.classList.add('visible');
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                statusText.classList.remove('visible');
            }, 1000);
        }

        // Render Tabs
        function renderTabs() {
            tabsContainer.innerHTML = '';
            
            Object.keys(state.pages).forEach(id => {
                const page = state.pages[id];
                
                const tabEl = document.createElement('div');
                tabEl.className = `tab ${id === state.activeTabId ? 'active' : ''}`;
                tabEl.dataset.id = id;
                
                const titleSpan = document.createElement('span');
                titleSpan.textContent = page.title;
                tabEl.appendChild(titleSpan);

                // Add close button if there's more than one tab
                if (Object.keys(state.pages).length > 1) {
                    const closeBtn = document.createElement('span');
                    closeBtn.className = 'close-tab';
                    closeBtn.innerHTML = '&times;';
                    closeBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openDeleteModal(id);
                    });
                    tabEl.appendChild(closeBtn);
                }

                tabEl.addEventListener('click', () => {
                    state.activeTabId = id;
                    renderTabs();
                    loadActivePageContent();
                    saveData();
                });

                tabsContainer.appendChild(tabEl);
            });
        }

        function loadActivePageContent() {
            const activePage = state.pages[state.activeTabId];
            notepad.value = activePage ? activePage.content : '';
            notepad.focus();
        }

        // Create a new page
        addTabBtn.addEventListener('click', () => {
            const newId = Date.now().toString();
            state.pages[newId] = {
                title: `Notes ${Object.keys(state.pages).length + 1}`,
                content: ''
            };
            state.activeTabId = newId;
            renderTabs();
            loadActivePageContent();
            saveData();
        });

        // Watch for typing
        notepad.addEventListener('input', () => {
            if (state.pages[state.activeTabId]) {
                state.pages[state.activeTabId].content = notepad.value;
                saveData();
            }
        });

        // Download action
        downloadBtn.addEventListener('click', () => {
            const activePage = state.pages[state.activeTabId];
            if (!activePage) return;

            const filename = `${activePage.title}.txt`;
            const blob = new Blob([activePage.content], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        /* --- Custom Modal Functions --- */
        function closeModal() {
            modalOverlay.classList.remove('active');
            currentModalAction = null;
            targetDeleteId = null;
        }

        // Open Rename Modal
        renameBtn.addEventListener('click', () => {
            const activePage = state.pages[state.activeTabId];
            if (!activePage) return;

            currentModalAction = 'rename';
            modalTitle.textContent = 'Rename Current Page';
            modalInputContainer.style.display = 'block';
            modalMessage.style.display = 'none';
            modalInput.value = activePage.title;
            
            modalConfirmBtn.textContent = 'Save Changes';
            modalConfirmBtn.className = 'btn';

            modalOverlay.classList.add('active');
            modalInput.focus();
            modalInput.select();
        });

        // Open Delete Modal
        function openDeleteModal(id) {
            currentModalAction = 'delete';
            targetDeleteId = id;
            
            modalTitle.textContent = 'Delete Page';
            modalInputContainer.style.display = 'none';
            modalMessage.style.display = 'block';
            modalMessage.textContent = `Are you sure you want to permanently delete "${state.pages[id].title}"?`;
            
            modalConfirmBtn.textContent = 'Delete';
            modalConfirmBtn.className = 'btn btn-danger';

            modalOverlay.classList.add('active');
        }

        // Modal Actions Handlers
        modalCancelBtn.addEventListener('click', closeModal);
        
        modalConfirmBtn.addEventListener('click', () => {
            if (currentModalAction === 'rename') {
                const newName = modalInput.value.trim();
                if (newName !== '') {
                    state.pages[state.activeTabId].title = newName;
                    renderTabs();
                    saveData();
                }
            } else if (currentModalAction === 'delete' && targetDeleteId) {
                delete state.pages[targetDeleteId];
                if (state.activeTabId === targetDeleteId) {
                    state.activeTabId = Object.keys(state.pages)[0];
                }
                renderTabs();
                loadActivePageContent();
                saveData();
            }
            closeModal();
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        modalInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                modalConfirmBtn.click();
            }
        });

        // Initialize App
        loadData();
    </script>
</body>
</html>
