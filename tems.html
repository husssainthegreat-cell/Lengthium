<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Dashboard</title>
    <style>
        /* General Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0a0a; /* Ultra dark background */
            color: #ffffff;
            min-height: 100vh;
        }

        /* Header & Navigation */
        header {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #333;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        nav a {
            text-decoration: none;
            color: #bbb;
            font-weight: 500;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        nav a:hover {
            color: #00ffcc; /* Neon accent on hover */
            text-shadow: 0 0 8px #00ffcc;
        }

        .logo img {
            height: 40px;
            display: block;
        }

        /* Dashboard Grid Section */
        .container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 20px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 images per row */
            gap: 25px;
        }

        /* Card Styling */
        .image-card {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            text-decoration: none; /* Remove underline from link */
            display: block;
        }

        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            border-color: #444;
        }

        .image-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .image-card:hover img {
            opacity: 1;
        }

        .card-info {
            padding: 15px;
            text-align: center;
            font-size: 0.9rem;
            color: #888;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            header {
                flex-direction: column-reverse;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <div class="logo">
            <img src="logo123.png" alt="Logo">
        </div>
    </header>

    <div class="container">
        <div class="dashboard-grid">
            
            <a href="gg.html" class="image-card">
                <img src="dashboards/img/ccc.png">
                <div class="card-info">Dashboard 1</div>
            </a>

             <a href="gg.html" class="image-card">
                <img src="dashboards/img/cool.png">
                <div class="card-info">Dashboard 2</div>
            </a>
 <a href="gg.html" class="image-card">
                <img src="dashboards/img/er.png">
                <div class="card-info">Dashboard 3</div>
            </a>
 <a href="gg.html" class="image-card">
                <img src="dashboards/img/qwer.png">
                <div class="card-info">Dashboard 4</div>
            </a>
 <a href="gg.html" class="image-card">
                <img src="dashboards/img/wq.png">
                <div class="card-info">Dashboard 5</div>
            </a>
 <a href="gg.html" class="image-card">
                <img src="dashboards/img/tt.png">
                <div class="card-info">Dashboard 6</div>
            </a>


        </div>
    </div>

</body>
</html>
