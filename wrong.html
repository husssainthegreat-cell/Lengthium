<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0e15;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .error-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 77, 77, 0.2);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(255, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .icon {
            font-size: 48px;
            color: #ff4d4d;
            margin-bottom: 16px;
            text-shadow: 0 0 15px rgba(255, 77, 77, 0.4);
        }

        h2 {
            font-size: 24px;
            letter-spacing: 1px;
            color: #ff4d4d;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.2);
        }

        p {
            color: #8a8f98;
            font-size: 15px;
            margin-bottom: 32px;
        }

        .btn-back {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            color: #00ffcc;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.05);
        }

        .btn-back:hover {
            background: #00ffcc;
            color: #0d0e15;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 204, 0.3);
        }

        .btn-back:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="icon">✕</div>
        <h2>OOPS! WRONG PASSWORD</h2>
        <p>The security code you entered is incorrect.</p>
        <a href="index.html" class="btn-back">BACK TO HOME</a>
    </div>

</body>
</html>
